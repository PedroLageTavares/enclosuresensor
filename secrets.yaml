# Copy this file to secrets.yaml and fill in your values.
# secrets.yaml is listed in .gitignore and should never be committed.

wifi_ssid: "YourWiFiSSID"
wifi_password: "YourWiFiPassword"

# Generate with: esphome generate-api-key
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"

# OTA (over-the-air update) password
ota_password: "REPLACE_WITH_OTA_PASSWORD"

# Fallback access-point password (min 8 characters)
ap_password: "REPLACE_WITH_AP_PASSWORD"
